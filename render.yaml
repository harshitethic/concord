# Render blueprint: New > Blueprint, pick this repository.
#
# The free plan has no persistent disk. Everything Concord stores, accounts included, is erased
# whenever the service restarts, redeploys or spins down after fifteen idle minutes.
# The dashboard does not show the "preview server" notice; setting CONCORD_EPHEMERAL=1 turns it
# back on. To keep data, move to a paid instance and attach a disk at /data.
services:
  - type: web
    name: concord
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CONCORD_SIGNUP
        value: open
      - key: CONCORD_SYNC_INTERVAL
        value: "60"
      # Render's proxy is the one hop whose X-Forwarded-For entry is believed for rate limits.
      - key: CONCORD_TRUST_PROXY
        value: "1"
      # Leave both empty to offer email and password only. The Google OAuth client's redirect URI
      # is https://<this service>.onrender.com/api/auth/google/callback.
      - key: CONCORD_GOOGLE_CLIENT_ID
        sync: false
      - key: CONCORD_GOOGLE_CLIENT_SECRET
        sync: false
